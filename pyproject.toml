[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "floquet-lindblad"
version = "0.1.0"
description = "Chebyshev-accelerated Arnoldi bit-flip-rate solver for driven, dissipative full-ATS systems (JAX + dynamiqs, GPU-only)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "jax==0.10.2",
    "jaxlib==0.10.2",
    "diffrax==0.7.2",
    "matplotlib",
    # Fork = upstream v0.3.6 + the `mesolve_fast` patch (precomputed L^dag L).
    # Rebased off the older base so it no longer reverts 10 upstream commits;
    # its solver options are flattened into kwargs to match v0.3.6's mesolve.
    "dynamiqs @ git+https://github.com/TheoMalas-Danze/dynamiqs.git@af64c63df011d09633f158d06d5f5b3ee637cf9e",
]

[project.optional-dependencies]
dev = ["nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]
